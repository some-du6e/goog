name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  # What `npm i -g goog-cli` gets: the compiled package, installed under
  # node_modules, where Node won't run .ts files.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pack
      - run: npm install -g ./goog-cli-*.tgz
      - run: goog help > /dev/null
      - run: test -f "$(npm root -g)/goog-cli/dist/skill/SKILL.md"
