# Publishes goog-cli to npm when a version tag (v0.2.0) is pushed. npm trusts
# this workflow by name (trusted publishing), so no npm token is stored.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # The same check as test.yml's package job, which tag pushes don't run.
      - run: npm pack
      - run: npm install -g ./goog-cli-*.tgz
      - run: goog help > /dev/null
      - run: test -f "$(npm root -g)/goog-cli/dist/skill/SKILL.md"
      - run: npm publish --access public
